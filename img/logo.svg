  </defs>
  <rect width="64" height="64" rx="16" fill="url(#rm-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.6"/>
