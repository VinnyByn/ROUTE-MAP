      <stop offset="0" stop-color="#173f4e"/>
      <stop offset="1" stop-color="#2f7a94"/>
    </linearGradient>
    <linearGradient id="rm-fiber" x1="10" y1="54" x2="50" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee0f5"/>
