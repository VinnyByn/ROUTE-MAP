name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # A cada 6 horas: republica o materiais.json com os preços da planilha

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar materiais.json e kits.json a partir das planilhas
        run: |
          pip install --quiet -r api/requirements.txt
          cd api && python -m scripts.export_json ../web/materiais.json ../web/kits.json
          python -c "import json,collections;d=json.load(open('../web/materiais.json'));print('SECOES',dict(collections.Counter(i['secao'] for i in d['itens'])))" || true
      - name: Baixar a base de postes (BDGD)
        # Gerada pelo workflow postes.yml (release "postes-AAAA-MM-DD"). Sem release, o site sai sem a camada de postes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("postes-"))][0].tagName // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern postes.tar.gz --dir "$RUNNER_TEMP"
            tar xzf "$RUNNER_TEMP/postes.tar.gz" -C web
            echo "Postes: $tag ($(jq -r .total web/postes/manifest.json) postes)"
          else
            echo "::warning::Ainda não há release de postes. Rode o workflow 'Postes da BDGD'."
          fi
      - name: Instalar Firebase CLI
        # Instala numa pasta à parte para fixar dependências quebradas no npm (ignore@7.0.11 foi retirado do registro)
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          npm init -y > /dev/null
          npm pkg set overrides.ignore=7.0.5
          npm install --no-audit --no-fund firebase-tools
          echo "$RUNNER_TEMP/fb/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Publicar no Firebase Hosting
        run: firebase deploy --only hosting --project routemap-21 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
