name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # A cada 6 horas: republica o materiais.json com os preços da planilha

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar materiais.json a partir da planilha de preços
        run: |
          pip install --quiet -r api/requirements.txt
          cd api && python export_json.py ../materiais.json
      - name: Instalar Firebase CLI
        # Instala numa pasta à parte para fixar dependências quebradas no npm (ignore@7.0.11 foi retirado do registro)
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          npm init -y > /dev/null
          npm pkg set overrides.ignore=7.0.5
          npm install --no-audit --no-fund firebase-tools
          echo "$RUNNER_TEMP/fb/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Publicar no Firebase Hosting
        run: firebase deploy --only hosting --project routemap-21 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
