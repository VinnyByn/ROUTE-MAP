name: Funções do Supabase

# Publica as funções do servidor (supabase/functions) quando elas mudam no main.
# Precisa do segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings › Secrets and variables › Actions),
# gerado em supabase.com/dashboard/account/tokens. Sem ele, o passo só avisa e não falha.
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ipdpilzhlchcxijsmgsf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes da função de contas
        run: node --experimental-strip-types tests/admin-users.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar admin-users
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN: a função admin-users não foi publicada."
            exit 0
          fi
          supabase functions deploy admin-users --project-ref "$SUPABASE_PROJECT_REF"
